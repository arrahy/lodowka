<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rybia lodówka</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1 hidden>Produkty w lodówce</h1>
    <main>
      <form action="#">
        <input
          type="text"
          name="product_name"
          id="name"
          required
          placeholder="Nazwa"
          autocomplete="off"
        />
        <div>
          <label for="product_firstDate">Data ważności</label>
          <input type="date" id="product_firstDate" required />
        </div>
        <div>
          <label for="product_secondDate">Data otwarcia</label>
          <input type="date" id="product_secondDate" />
        </div>
        <div>
          <label for="product_afterOpen">Ile dni ważne po otwarciu?</label>
          <input type="number" id="product_afterOpen" required />
        </div>
        <input type="submit" value="Dodaj" id="add" class="submit" />
      </form>
    </main>
    <script src="./src/script.js"></script>
  </body>
</html>
